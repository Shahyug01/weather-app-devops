<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
    <h1>Weather App</h1>
    <p class="subtitle">Live weather using Open-Meteo</p>

    <div class="search-box">
        <input id="cityInput" type="text" placeholder="Enter city name" aria-label="City name">
        <button id="searchBtn">Search</button>
    </div>

    <p id="message" role="status"></p>

    <section id="weatherResult" class="weather-card" hidden>
        <h2 id="cityName"></h2>
        <p id="temperature"></p>
        <p id="condition">Current weather data received</p>
        <p id="humidity"></p>
        <p id="wind"></p>
    </section>
</main>
<script src="script.js"></script>
</body>
</html>
